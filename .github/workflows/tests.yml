# Calls the same target as the local run, and nothing beyond it.
#
# Only `fast`, and deliberately without [zigzag]: this is what `pyproject.toml` promises
# the user — `pip install -e .` works and the tests pass without the optional backends.
# A clean machine catches what a working one does not: a forgotten dependency, a test
# that relies on a file present on one disk only.
#
# `slow` (about 11 minutes) and `zigzag` (about 6) remain local targets.
name: tests

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install without optional backends
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: make fast
        run: make fast
