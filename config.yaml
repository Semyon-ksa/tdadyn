# Все параметры генерации синтетических данных.
# Магических чисел в коде быть не должно: любое число, влияющее на результат, живёт здесь.

format_version: 2         # 2: обязательный truth_kind, поля edge_rule/edge_threshold
seed: 20260201            # базовый seed; каждый генератор получает производный поток
output_root: data/synthetic   # относительно каталога этого файла, не рабочего каталога

# --- Имена каталогов наборов ---
naming:
  float_precision: 6           # значащих цифр для float-параметров в имени каталога

# --- Параметры проверки топологии (общие, НЕ подбираются под датасет) ---
topology_check:
  max_homology_dim: 2
  coeff_field: 2                 # Z/p, p простое. Влияет на бутылку Клейна:
                                 # p=2 -> (1,2,1), p=3 -> (1,1,0). Рациональных
                                 # коэффициентов в ripser/gudhi нет; Q проверяется
                                 # через p=3 (см. docs/method.md, раздел 1.2)
  coeff_field_test_values: [2, 3]  # для параметризованного теста бутылки Клейна.
                                 # Эталон (путь B) работает только при p=2;
                                 # при p=3 доступен только основной пайплайн (путь A)
  # Критерий значимости ОТКАЛИБРОВАН: 0 промахов на всех 54 комбинациях таблицы
  # docs/validation.md, раздел 2 (9 случаев x 3 сида x 2 уровня шума).
  # Старое правило (persistence >= ratio * diam) непригодно: 9 промахов из 54 —
  # теряет полость тора и бутылки Клейна. Обоснование — method.md, 1.2a.
  criterion: gap                 # gap | diam_ratio (второе оставлено для сравнения)
  significance_ratio: 0.15       # используется только при criterion: diam_ratio
  # Параметры взяты из центра области нулевых промахов, а не с её края:
  # нуль держится при floor от 0.05 до 0.10 и gap_min от 1.45 до 1.62.
  gap_noise_floor_ratio: 0.07    # отсечка шумового пола, в долях diam(X)
  gap_min_ratio: 1.55            # минимальный разрыв, ниже которого признаков нет
  calibration_seeds: [20260201, 7, 99]
  reference_max_nodes: 30        # предел для медленной эталонной реализации
  # Перекрёстная проверка A vs B на семействе 1 (см. docs/validation.md, раздел 1.1).
  # Сравнивается СОГЛАСИЕ реализаций на одном комплексе, а не совпадение с таблицей.
  cross_check_n_points: 18       # размер подвыборки; ограничен стоимостью d3 ~ C(n,4)
  cross_check_n_scales: 9        # масштабы = середины между соседними расстояниями

# --- Семейство 1: статические облака ---
static_clouds:
  n_points: 400                  # значение по умолчанию для плоских объектов
  # По-генераторные переопределения. Измерено: тор и бутылка Клейна при 400 точках
  # не дают разделения в H1/H2. При 600 разрыв в H1 всё ещё неустойчив по сидам:
  # у тора отношения на позициях 1 и 2 равны 1.73 и 1.62, то есть наибольшим
  # оказывается ложный, и beta_1 выходит 1 вместо 2. При 900 точках истинный разрез
  # даёт 2.0-2.35 против случайных 1.3-1.65 на всех трёх калибровочных сидах.
  n_points_by_generator:
    torus: 900
    klein_bottle: 900
  noise_sigma: 0.03
  ambient_noise: gaussian

  circle:
    radius: 1.0
  two_circles:
    radius: 1.0
    separation: 3.0              # > 2*radius, иначе компоненты сольются
  figure_eight:
    scale: 1.0
  torus:
    R: 2.0
    r: 0.8
    sampling: rejection          # rejection | naive — naive НЕ равномерен по площади
  sphere:
    radius: 1.0
    sampling: muller             # muller | naive_angles
  klein_bottle:
    embedding: r4_tube           # трубчатое вложение в R^4 (method.md, 1.1);
                                 # r3 даёт самопересечение и портит ground-truth
    a: 1.8                       # больший радиус; обязательно a > b
    b: 1.0
    sampling: rejection          # плотность ~ sqrt((a+b cos v)^2 + b^2 sin^2(v)/4)
  hopf_link:
    radius: 1.0
    offset: 1.0                  # смещение центра второй окружности

# Построение взвешенной сети из облака
network_from_cloud:
  method: gaussian_kernel        # gaussian_kernel | knn
  # Ширина ядра задаётся в долях МЕДИАННОГО попарного расстояния, а не абсолютным
  # числом: масштабы объектов семейства 1 различаются. Измерено: абсолютное 0.5 при
  # диаметре тора 5.71 схлопывает 60% весов ниже 1e-6 и ломает one_minus (см.
  # docs/method.md, 1.3). При ширине 2.0 оба преобразования верны.
  kernel_sigma_median_fraction: 0.65
  kernel_sigma_by_generator: {}  # абсолютные переопределения, если понадобятся
  max_collapsed_weight_fraction: 0.10   # сторож: доля весов < 1e-6; выше — ядро вырождено
  # k-NN: расстояния = кратчайшие пути по графу (геодезика, конструкция Isomap).
  # НЕ средство контроля сложности: матрица кратчайших путей плотная, комплекс Рипса
  # такого же размера (см. docs/method.md, 1.3). Ценность — внутренняя метрика.
  # k работает в ОКНЕ: снизу граф рвётся на компоненты, сверху короткое замыкание
  # (хорды поперёк дырок). Измерено на торе: diam_geo сползает с 7.72 (k=8) до 5.72
  # (k=250) при евклидовом 5.71 — метрика выродилась.
  # Измерено при 900 точках (тор и Клейн): k=10 теряет петлю, k=20..160 верны,
  # отношение диаметров сползает с 1.32 (k=10) до 1.11 (k=160) — сторож 1.10 срабатывает
  # около k=180. Принято 40: середина окна в логарифме, вдвое от нижнего отказа и
  # вчетверо от сторожа. 20 работает, но стоит на самом краю.
  # 40 — не значение по умолчанию, а измеренное: проверено на всех ПЯТИ связных объектах
  # (окружность, восьмёрка, тор, сфера, бутылка Клейна) на трёх калибровочных сидах.
  # Окна: у окружности и сферы верно на всём ряду 10..160; у восьмёрки до 80 (при 160
  # отношение 1.02, сторож срабатывает); у тора и Клейна снизу отказ при 10, сверху
  # сторож около 180. 40 лежит внутри пересечения всех пяти окон.
  knn_k: 40
  # Двум окружностям нужен больший k: компоненты разделены пустотой, и при 20 и 40 граф
  # несвязен. Окно k=80..100 (при 60 рвётся на сидах 7 и 99, при 120 сторож); принято 100.
  # Зацепления Хопфа здесь НЕТ намеренно: он исключён из геодезической конструкции целиком,
  # потому что мостовые циклы у вплотную проходящих компонент долговечны и неотличимы от
  # настоящих признаков ни при каком k (docs/method.md, 1.3). Переопределение для него
  # выглядело бы подобранным значением, тогда как рабочего значения не существует.
  knn_k_by_generator:
    two_circles: 100
  knn_symmetrize: union          # union | mutual — union даёт связность при меньшем k
  knn_require_connected: true    # несвязный граф -> явная ошибка, не подмена бесконечностей
  min_geodesic_diameter_ratio: 1.10  # сторож: diam_geo / diam_euclid; ближе к 1 -> вырождение
  # Оба преобразования равноправны и оба проверяются. one_minus НЕ запрещать:
  # это стандартный выбор для коннектомов (d = 1 - |r|) в Задаче 3. sqrt_neg_log
  # осмыслен только для гауссова ядра, к корреляционной матрице неприменим.
  distance_from_similarity: sqrt_neg_log   # sqrt_neg_log | one_minus
  test_both_transforms: true

# --- Семейство 2: динамические графы с событиями ---
dynamic_events:
  n_nodes: 24                    # <= reference_max_nodes, иначе эталон не посчитать
  n_snapshots: 60
  edge_weight: 1.0
  threshold: 0.5                 # порог бинаризации для флаг-комплекса
  scenarios:
    cycle_lifecycle:
      path_closes_at: 12         # рождение H1
      chord_added_at: 27         # рождение второго H1
      edge_removed_at: 41        # гибель H1
      component_splits_at: 48    # рождение H0
      component_merges_at: 55    # гибель H0
    # Метрический сценарий: точки на окружности, комплекс Рипса на каждом кадре.
    # Спецификация дописана в S7 — method.md, 2.1a; все числа там измерены эталоном.
    geometric_loop:
      n_points: 24               # <= reference_max_nodes (было 60 при пределе 30)
      rips_epsilon: 0.8          # середина окна (2*pi*R_max/n, R_min*sqrt(3)) =
                                 # (0.367, 1.732) в логарифмическом масштабе.
                                 # Снизу граф рассыпается на n компонент, сверху
                                 # VR(S^1) уходит в режим S^3 и beta_1 гибнет
      radius_schedule: [1.0, 1.4, 1.0]   # кусочно-линейно по индексу снимка;
                                 # дыхание радиуса событий не порождает
      gap_angle: 1.2             # ширина открытого разрыва, радианы. Требуется
                                 # 2*R_min*sin(gap/2) > eps, то есть > 0.823;
                                 # при 0.8 петля на малом радиусе не рвётся
      gap_open_at: 20            # гибель H1
      gap_close_at: 45           # рождение H1

# --- Семейство 3: SBM и осцилляторы ---
dynamic_sbm:
  n_nodes: 60
  n_snapshots: 60
  block_sizes: [15, 15, 15, 15]
  p_in: 0.35
  p_out: 0.02
  merge_at: 20                   # два сообщества сливаются
  split_at: 40                   # сообщество делится

oscillators:
  model: kuramoto                # kuramoto | roessler
  n_channels: 30
  n_timepoints: 3000        # == regime_length * len(regimes), иначе ряд и coupling.npy
                            # разъезжаются и окно сопоставляется не с тем режимом
  dt: 0.2                   # окно должно покрывать НЕСКОЛЬКО периодов колебания:
                            # при dt=0.01 окно занимало 0.16 периода и корреляция
                            # внутри блока (0.946) не отличалась от межблочной (0.936)
  kuramoto:
    K: 6.0                   # выше порога синхронизации: эффективная связь внутри
                             # блока (K/N)*(block-1) = 1.8 против K_c ~ 1.6
    omega_dist: normal
    omega_scale: 1.0
  roessler:
    a: 0.2
    b: 0.2
    c: 5.7
    # Связь работает в ОКНЕ, как и k в network_from_cloud. Сверху — полная
    # синхронизация: при 0.04 каналы внутри блока совпадают побитово (разброс 2.7e-9,
    # при 0.15 ровно 0), |r| внутри блока равен ровно 1, и набор вырождается — внутри
    # блока не остаётся никакой изменчивости. Снизу связь не проявляется: при 0.002
    # разрыв |r| внутри/между всего 0.090. Измерено (разрыв |r|, сид 20260201):
    #   0.002 -> 0.090   0.005 -> 0.440   0.01 -> 0.542   0.02 -> 0.445   0.04+ -> вырождение
    # Принято 0.01 — середина окна [0.005, 0.02] в логарифмическом масштабе.
    epsilon: 0.01
  integrator:
    method: RK45
    rtol: 1.0e-6
    atol: 1.0e-9
  coupling_schedule:
    regime_length: 1000          # должно быть >> sliding_window.length
    transient_length: 1000       # интегрируется под первым режимом и отбрасывается:
                                 # Рёсслер стартует вне аттрактора (method.md, 3.1a)
    # Режим — это разбиение каналов на блоки (method.md, 3.1a). Соседние разбиения
    # обязаны быть связаны измельчением, иначе это не слияние и не деление, а
    # перенарезка: [10,10,10] -> [20,10] сливает два блока, обратный переход делит.
    regimes:
      - [10, 10, 10]
      - [20, 10]
      - [10, 10, 10]

sliding_window:
  length: 100
  step: 10
  fisher_z: true                 # только для статистики согласия с A(t); в путь
                                 # к расстояниям не идёт (method.md, 3.4)
  # Формализует требование "L << длительность режима" из method.md §3.4: окно длиннее
  # доли режима размазывает событие через границу режима и не даёт его локализовать.
  max_length_fraction_of_regime: 0.2
  # Порог согласия восстановленной связности с истинным A(t) (validation.md, семейство 3).
  # ОТКАЛИБРОВАН на трёх сидах [20260201, 7, 99], Курамото, статистика — усреднённая по
  # окнам режима матрица |r| против A(t) этого режима (9 значений: 3 сида x 3 режима):
  #   истина:            min 0.383, max 0.878
  #   перестановка меток: min -0.039, max 0.068   <- честный нулевой контроль
  # Принято 0.25 — близко к центру разрыва (0.068, 0.383): втрое выше нуля и в полтора
  # раза ниже худшего истинного случая.
  # ЧЕГО ПОРОГ НЕ ДЕЛАЕТ: не различает режимы между собой. Сравнение с ЧУЖИМ режимом
  # даёт до 0.440, то есть перекрывается с истиной. Это следствие вложенности разбиений
  # (method.md, 3.1a): [20,10] — огрубление [10,10,10], и соседние режимы совпадают
  # большей частью структуры. Статистика проверяет «окно восстанавливает связь», а не
  # «окно различает режимы».
  # Область применимости: только Курамото с параметрами из этого файла. На Рёсслера НЕ
  # переносится — при epsilon=0.15 блоки синхронизуются полностью, каналы внутри блока
  # побитово совпадают и |r| внутри блока равен ровно 1. На коннектомы Задачи 3 тем
  # более не переносится; механизм тот же, что у topology_check (method.md, 1.2a).
  min_coupling_agreement: 0.25

# --- Семейство 4: шум и нулевые модели ---
noise:
  weight_jitter_sigma: [0.0, 0.05, 0.10, 0.20]
  spurious_edge_fraction: [0.0, 0.02, 0.05, 0.10]
  missing_edge_fraction: [0.0, 0.02, 0.05, 0.10]
  point_jitter_sigma: [0.0, 0.02, 0.05, 0.10]
  n_repeats: 10                  # повторов на уровень шума

null_models:
  # Разведены по двум пайплайнам проекта (method.md, 4.2). match_density_to убран, а не
  # доопределён: у фильтрации Рипса по облаку параметра плотности нет вообще — фильтрация
  # проходит все пороги. Плотность осмысленна только для порогованного графа, то есть
  # для семейства 2, и там её цель — снимки cycle_lifecycle, где она однозначна.
  uniform_cloud:                 # нулевая модель семейства 1: облако -> Рипс
    n_points: 400                # см. измерение ниже: при 200 частота 6%, при 400 — 1.5%
    dim: 3
  erdos_renyi:                   # нулевая модель семейства 2: снимки -> флаг-комплекс
    n_nodes: 24                  # <= reference_max_nodes, иначе кривую нечем считать
    n_snapshots: 60
  n_realizations: 20
  # Критерий значимости имеет НЕНУЛЕВУЮ частоту ложных срабатываний на случайных облаках.
  # Это свойство критерия, а не набора (method.md, 1.2a): отказывает ветвь beta_k = 0,
  # когда над шумовым полом уцелел ровно один бар и сравнивать его не с чем.
  # Измерено НА ПОТОКЕ САМОГО ГЕНЕРАТОРА (10 сидов x 20 реализаций = 200 испытаний),
  # ожидание (1,0,0), R^3:
  #   n=200 -> 12/200 = 6.0% (95% сверху 10.2%)
  #   n=400 ->  3/200 = 1.5% (95% сверху  4.3%)
  # Плато НЕТ: переход с 200 на 400 снижает частоту вчетверо. Ранняя оценка «плато на 2%»
  # была получена на 60 испытаниях И НА ДРУГОМ ПОТОКЕ — при таком объёме 1/60 и 4/60
  # неразличимы, и «плато» было шумом.
  # На трёх калибровочных сидах при n=400 промахов 0 из 60 (при n=200 было 4 из 60).
  # Порог держится выше 95%-границы истинной частоты (4.3%), а не выше наблюдённого нуля:
  # утверждать ноль по 60 испытаниям нельзя, а регрессию порог поймает.
  max_false_positive_rate: 0.05

# --- Задача 2: зигзаг-персистентность и временные диаграммы ---
# Границу S6 соблюдаем: в конфиг идёт то, что можно менять, НЕ переписывая доказательство.
# Поэтому здесь НЕТ и не будет:
#   union_rule       — от него зависит инвариант (zigzag.md, 2.2); константа модуля
#                      UNION_RULE, альтернатива живёт только внутри измеряющего теста
#   index_convention — от неё зависит перевод бара в событие; ключ приглашал бы сдвинуть
#                      её на единицу и получить ошибку локализации, неотличимую от
#                      дефекта алгоритма
#   significance     — критерий значимости бара в зигзаге НЕ определён, и ключ создавал бы
#                      впечатление, что определён. topology_check сюда не наследуется
#                      (zigzag.md, 7): он откалиброван на облаках семейства 1, и, кроме
#                      того, критерий не инвариантен к перепараметризации фильтрации
#   edge_rule        — свойство набора, читается из истины, потребителем не настраивается
zigzag:
  backend: reference             # reference | dionysus | fzz — реализация, а не истина.
                                 # Порядок нерушим: оракул (Z2) до бэкенда (Z3), иначе
                                 # бэкенд становится собственным эталоном
  max_homology_dim: 1            # комплекс строится до max_homology_dim + 1. Меньше, чем
                                 # у topology_check (2), намеренно: у обоих наборов
                                 # семейства 2 события живут в H0 и H1, а стоимость
                                 # растёт быстро. Больше — запрещено перекрёстной
                                 # проверкой: выше потолка генераторов истины нет
  coeff_field: 2                 # при p != 2 — явная ошибка, как в reference/.
                                 # Названо как в topology_check: два написания одного
                                 # понятия в одном файле — приглашение прочитать не тот ключ
  event_matching:                # сопоставление предсказанного лога с истинным (zigzag.md, 6)
    tolerance: 0                 # допуск по индексу снимка. Ноль принят, но НЕ проверено,
                                 # достижим ли он при ненулевом шуме; если нет — величина
                                 # станет отчётной, а не настройкой (Z4)
    match_dimension: true        # разные размерности не матчатся: сводный recall скрыл бы
                                 # алгоритм, безупречный в H0 и слепой в H1
    match_type: true             # рождение не матчится с гибелью
  oracle:
    level: L3                    # L1 | L2 | L3 — глубина независимой проверки.
                                 # L1 (числа Бетти) и L2 (ранги стрелок) необходимы и
                                 # НЕДОСТАТОЧНЫ: покрытия не различают {[1,4],[2,3]} и
                                 # {[1,3],[2,4]} (zigzag.md, 3.4). Сверка — бар в бар
    max_index_count: 200         # выше — L3 только спот-проверками: он квадратичен по |I|.
                                 # На cycle_lifecycle |I| = 2*60-1 = 119, считается полностью
  report:                        # что считается и протоколируется, а не отбрасывается молча
    invisible_bars: true         # носитель не содержит ни одного целого индекса
    ephemeral_bars: true         # рождение и гибель внутри одного перехода
    half_index_events: true      # событие на объединении, которого нет ни в одном снимке
    censored_bars: true          # бар касается края последовательности
