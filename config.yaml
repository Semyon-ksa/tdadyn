# Все параметры генерации синтетических данных.
# Магических чисел в коде быть не должно: любое число, влияющее на результат, живёт здесь.

format_version: 1
seed: 20260201            # базовый seed; каждый генератор получает производный поток
output_root: data/synthetic   # относительно каталога этого файла, не рабочего каталога

# --- Имена каталогов наборов ---
naming:
  float_precision: 6           # значащих цифр для float-параметров в имени каталога

# --- Параметры проверки топологии (общие, НЕ подбираются под датасет) ---
topology_check:
  max_homology_dim: 2
  coeff_field: 2                 # Z/p, p простое. Влияет на бутылку Клейна:
                                 # p=2 -> (1,2,1), p=3 -> (1,1,0). Рациональных
                                 # коэффициентов в ripser/gudhi нет; Q проверяется
                                 # через p=3 (см. docs/method.md, раздел 1.2)
  coeff_field_test_values: [2, 3]  # для параметризованного теста бутылки Клейна.
                                 # Эталон (путь B) работает только при p=2;
                                 # при p=3 доступен только основной пайплайн (путь A)
  # Критерий значимости ОТКАЛИБРОВАН: 0 промахов на всех 54 комбинациях таблицы
  # docs/validation.md, раздел 2 (9 случаев x 3 сида x 2 уровня шума).
  # Старое правило (persistence >= ratio * diam) непригодно: 9 промахов из 54 —
  # теряет полость тора и бутылки Клейна. Обоснование — method.md, 1.2a.
  criterion: gap                 # gap | diam_ratio (второе оставлено для сравнения)
  significance_ratio: 0.15       # используется только при criterion: diam_ratio
  # Параметры взяты из центра области нулевых промахов, а не с её края:
  # нуль держится при floor от 0.05 до 0.10 и gap_min от 1.45 до 1.62.
  gap_noise_floor_ratio: 0.07    # отсечка шумового пола, в долях diam(X)
  gap_min_ratio: 1.55            # минимальный разрыв, ниже которого признаков нет
  calibration_seeds: [20260201, 7, 99]
  reference_max_nodes: 30        # предел для медленной эталонной реализации
  # Перекрёстная проверка A vs B на семействе 1 (см. docs/validation.md, раздел 1.1).
  # Сравнивается СОГЛАСИЕ реализаций на одном комплексе, а не совпадение с таблицей.
  cross_check_n_points: 18       # размер подвыборки; ограничен стоимостью d3 ~ C(n,4)
  cross_check_n_scales: 9        # масштабы = середины между соседними расстояниями

# --- Семейство 1: статические облака ---
static_clouds:
  n_points: 400                  # значение по умолчанию для плоских объектов
  # По-генераторные переопределения. Измерено: тор и бутылка Клейна при 400 точках
  # не дают разделения в H1/H2. При 600 разрыв в H1 всё ещё неустойчив по сидам:
  # у тора отношения на позициях 1 и 2 равны 1.73 и 1.62, то есть наибольшим
  # оказывается ложный, и beta_1 выходит 1 вместо 2. При 900 точках истинный разрез
  # даёт 2.0-2.35 против случайных 1.3-1.65 на всех трёх калибровочных сидах.
  n_points_by_generator:
    torus: 900
    klein_bottle: 900
  noise_sigma: 0.03
  ambient_noise: gaussian

  circle:
    radius: 1.0
  two_circles:
    radius: 1.0
    separation: 3.0              # > 2*radius, иначе компоненты сольются
  figure_eight:
    scale: 1.0
  torus:
    R: 2.0
    r: 0.8
    sampling: rejection          # rejection | naive — naive НЕ равномерен по площади
  sphere:
    radius: 1.0
    sampling: muller             # muller | naive_angles
  klein_bottle:
    embedding: r4_tube           # трубчатое вложение в R^4 (method.md, 1.1);
                                 # r3 даёт самопересечение и портит ground-truth
    a: 1.8                       # больший радиус; обязательно a > b
    b: 1.0
    sampling: rejection          # плотность ~ sqrt((a+b cos v)^2 + b^2 sin^2(v)/4)
  hopf_link:
    radius: 1.0
    offset: 1.0                  # смещение центра второй окружности

# Построение взвешенной сети из облака
network_from_cloud:
  method: gaussian_kernel        # gaussian_kernel | knn
  kernel_sigma: 0.5
  knn_k: 10
  distance_from_similarity: sqrt_neg_log   # sqrt_neg_log | one_minus

# --- Семейство 2: динамические графы с событиями ---
dynamic_events:
  n_nodes: 24                    # <= reference_max_nodes, иначе эталон не посчитать
  n_snapshots: 60
  edge_weight: 1.0
  threshold: 0.5                 # порог бинаризации для флаг-комплекса
  scenarios:
    cycle_lifecycle:
      path_closes_at: 12         # рождение H1
      chord_added_at: 27         # рождение второго H1
      edge_removed_at: 41        # гибель H1
      component_splits_at: 48    # рождение H0
      component_merges_at: 55    # гибель H0
  geometric_loop:
    n_points: 60
    radius_schedule: [1.0, 1.4, 1.0]
    gap_open_at: 20
    gap_close_at: 45

# --- Семейство 3: SBM и осцилляторы ---
dynamic_sbm:
  n_nodes: 60
  n_snapshots: 60
  block_sizes: [15, 15, 15, 15]
  p_in: 0.35
  p_out: 0.02
  merge_at: 20                   # два сообщества сливаются
  split_at: 40                   # сообщество делится

oscillators:
  model: kuramoto                # kuramoto | roessler
  n_channels: 30
  n_timepoints: 4000
  dt: 0.01
  kuramoto:
    K: 1.2
    omega_dist: normal
    omega_scale: 1.0
  roessler:
    a: 0.2
    b: 0.2
    c: 5.7
    epsilon: 0.15
  integrator:
    method: RK45
    rtol: 1.0e-6
    atol: 1.0e-9
  coupling_schedule:
    regime_length: 1000          # должно быть >> sliding_window.length
    regimes: [block_2, block_3, block_2]

sliding_window:
  length: 100
  step: 10
  fisher_z: true
  # Формализует требование "L << длительность режима" из method.md §3.4: окно длиннее
  # доли режима размазывает событие через границу режима и не даёт его локализовать.
  max_length_fraction_of_regime: 0.2

# --- Семейство 4: шум и нулевые модели ---
noise:
  weight_jitter_sigma: [0.0, 0.05, 0.10, 0.20]
  spurious_edge_fraction: [0.0, 0.02, 0.05, 0.10]
  missing_edge_fraction: [0.0, 0.02, 0.05, 0.10]
  point_jitter_sigma: [0.0, 0.02, 0.05, 0.10]
  n_repeats: 10                  # повторов на уровень шума

null_models:
  erdos_renyi:
    match_density_to: torus      # плотность подбирается под эталонный набор
  random_geometric:
    n_nodes: 60
    match_density_to: torus
  n_realizations: 20
