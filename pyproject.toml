[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdadyn"
version = "0.1.0"
description = "Synthetic datasets with analytically known topology for validating persistent homology pipelines"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.2",
    "gudhi>=3.9",
    "ripser>=0.6",
    "persim>=0.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Zigzag backends. Optional: `pip install -e .` must work without them, and the `fast`
# target must pass in such an environment. The backend is imported inside a function.
#
# Measured, not written from memory: dionysus 2.2.3 installs as a prebuilt wheel
# (macosx arm64, cp312) and needs no Boost — the old concern about building from source
# does not apply to Dionysus, and the "optional dependencies" decision now rests on fzz.
# fast-zigzag (Dey-Hou) is not on PyPI: the names fzz, fast-zigzag, fastzigzag, fzzpy,
# pyfzz, fast_zigzag were checked — no distribution. It is not declared here, and not only
# because a line for a non-existent package would break installation: the check is the
# ORACLE, which computes the barcode by a different method, while a second backend repeats
# the same class of algorithm and cannot say which side is right when they disagree. Its
# value is speed, which is not part of the correctness criterion (docs/zigzag.md 5.3).
zigzag = ["dionysus>=2.2"]
# Report notebooks. Kept apart from dev because the tests do not need them, and jupyter
# makes CI noticeably heavier. nbconvert is listed because the HTML reports are produced
# with it; `make report-zigzag` builds both the notebook and the HTML.
notebook = [
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbclient>=0.9",
    "nbconvert>=7.0",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pytest -q` runs the fast suite; `pytest -m slow` runs only the topological checks,
# because the last -m on the command line overrides this one.
#
# `not slow_zigzag` is part of the default and not an afterthought: with `-m "not slow"`
# alone a zigzag test marked slow_zigzag would run in the *fast* suite, which is the one
# that must stay green in an environment without the optional backends.
addopts = ["-m", "not slow and not slow_zigzag"]
markers = [
    "slow: topological checks (persistent homology, reference implementation)",
    "slow_zigzag: zigzag oracle and backend runs; may need the [zigzag] extra",
]
