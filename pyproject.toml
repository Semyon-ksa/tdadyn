[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdadyn"
version = "0.1.0"
description = "Synthetic datasets with analytically known topology for validating persistent homology pipelines"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.2",
    "gudhi>=3.9",
    "ripser>=0.6",
    "persim>=0.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Зигзаг-бэкенды Задачи 2. Необязательные: `pip install -e .` обязана работать без них,
# и цель `fast` обязана проходить в таком окружении. Импорт бэкенда — внутри функции.
#
# Замерено в Z0, а не выписано по памяти: dionysus 2.2.3 ставится готовым колесом
# (macosx arm64, cp312), Boost при этом не нужен — прежнее опасение не подтвердилось.
# fast-zigzag (Dey-Hou) на PyPI отсутствует: проверены имена fzz, fast-zigzag,
# fastzigzag, fzzpy, pyfzz, fast_zigzag — ни одного дистрибутива. В Z3 он собирается
# из исходников (github.com/taohou01/fzz) и здесь не объявляется: строка в extras
# для несуществующего пакета сломала бы установку целиком.
zigzag = ["dionysus>=2.2"]
# Отчётный ноутбук: notebooks/report.ipynb. Вынесено отдельно от dev, потому что
# тестам это не нужно, а CI из-за jupyter тяжелеет заметно.
notebook = ["matplotlib>=3.8", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pytest -q` runs the fast suite; `pytest -m slow` runs only the topological checks,
# because the last -m on the command line overrides this one.
#
# `not slow_zigzag` is part of the default and not an afterthought: with `-m "not slow"`
# alone a zigzag test marked slow_zigzag would run in the *fast* suite, which is the one
# that must stay green in an environment without the optional backends.
addopts = ["-m", "not slow and not slow_zigzag"]
markers = [
    "slow: topological checks (persistent homology, reference implementation)",
    "slow_zigzag: zigzag oracle and backend runs; may need the [zigzag] extra",
]
